
backend:
  name: github
  repo: riandiantara99-art/hmj-mpi-uin-ril.
  branch: main
  open_authoring: true
  base_url: https://rapid-haze-8670hmj-mpi-oauth.riandiantara99.workers.dev
  auth_endpoint: /auth

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "berita"
    label: "Berita"
    folder: "content/berita"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Judul", name: "title", widget: "string" }
      - { label: "Tanggal", name: "date", widget: "datetime" }
      - { label: "Isi", name: "body", widget: "markdown" }
